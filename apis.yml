name: Route 92 Medical
description: 'Route 92 Medical (r92m) is a neurovascular medical device company committed to
  improving outcomes for stroke and neurovascular patients through revolutionary procedural change.
  Its portfolio includes the FreeClimb System of access and aspiration catheters (models 54, 70, and 88),
  the HiPoint Reperfusion System built on the Monopoint Approach (under investigation in the SUMMIT MAX
  clinical trial), and the Ascent product line. The company was surfaced as a portfolio company of
  Norwest Venture Partners and added to the API Evangelist network. Route 92 Medical publishes a
  corporate marketing and clinical-evidence website but exposes no public developer, API, or
  documentation surface at this time.'
